version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directories:
      - "/src/docker/*"
    schedule:
      interval: "monthly"
    ignore:
      # images have to match the interpreter_constraints in pants.toml, so only patch releases are wanted
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-base-images:
        group-by: dependency-name
  - package-ecosystem: "docker-compose"
    directories:
      - "/compose-files/*"
    schedule:
      interval: "monthly"
    groups:
      compose-images:
        group-by: dependency-name
